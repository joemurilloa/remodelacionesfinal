{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Editar Categoría</h1>
        <a href="{{ url_for('gestionar_categorias') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i> Volver a Categorías
        </a>
    </div>
    
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0">Datos de la Categoría</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('editar_categoria', id=categoria.id) }}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la Categoría</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ categoria.nombre }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo de Transacción</label>
                            <select class="form-select" id="tipo" name="tipo" disabled>
                                <option value="ingreso" {% if categoria.tipo == 'ingreso' %}selected{% endif %}>Ingreso</option>
                                <option value="gasto" {% if categoria.tipo == 'gasto' %}selected{% endif %}>Gasto</option>
                            </select>
                            <div class="form-text">El tipo de categoría no se puede cambiar para mantener la integridad contable.</div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ categoria.descripcion }}</textarea>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('gestionar_categorias') }}" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
